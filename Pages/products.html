
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essenza | Our Perfumes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f5ef;
            color: #1c1c1c;
        }

        /* ================= NAVBAR ================= */

        header {
            width: 100%;
            background: #111;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            height: 75px;
            margin: auto;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #d4af37;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        .cart-btn {
            background: #d4af37;
            color: #111 !important;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
        }

        /* ================= PAGE HEADER ================= */

        .page-header {
            background: #111;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .page-header .label {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 5px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .page-header h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .page-header p {
            color: #bbb;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        /* ================= MAIN ================= */

        .shop {
            max-width: 1200px;
            margin: auto;
            padding: 70px 25px;
        }

        /* ================= FILTER ================= */

        .filter-area {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .filter-btn {
            border: 1px solid #bbb;
            background: white;
            padding: 11px 25px;
            cursor: pointer;
            border-radius: 25px;
            font-size: 14px;
            transition: 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* ================= PRODUCT GRID ================= */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.13);
        }

        .image-container {
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .category-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #d4af37;
            color: #111;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 19px;
            margin-bottom: 7px;
        }

        .product-type {
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .price {
            color: #b08d20;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .details-btn,
        .add-btn {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .details-btn {
            border: 1px solid #222;
            color: #222;
            background: white;
        }

        .details-btn:hover {
            background: #222;
            color: white;
        }

        .add-btn {
            border: 1px solid #d4af37;
            background: #d4af37;
            color: #111;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #111;
            color: white;
            border-color: #111;
        }

        /* ================= CART MESSAGE ================= */

        .cart-message {
            position: fixed;
            right: 25px;
            bottom: 25px;

            background: #111;
            color: white;

            padding: 16px 25px;
            border-radius: 5px;

            display: none;
            z-index: 2000;

            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .cart-message span {
            color: #d4af37;
            font-weight: bold;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #080808;
            color: white;
            text-align: center;
            padding: 45px 20px;
            margin-top: 30px;
        }

        footer .logo {
            margin-bottom: 15px;
        }

        footer p {
            color: #999;
            margin-top: 10px;
            font-size: 14px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 750px) {

            .navbar {
                height: auto;
                padding: 18px 20px;
                flex-direction: column;
                gap: 18px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-header h1 {
                font-size: 38px;
            }
        }

        @media (max-width: 500px) {

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 330px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                ESSENZA
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="products.html">Products</a>
                </li>

                <li>
                    <a href="index.html#about">About</a>
                </li>

                <li>
                    <a href="cart.html" class="cart-btn">
                        🛒 Cart
                        <span id="cartCount">0</span>
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">

        <div class="label">
            ESSENZA COLLECTION
        </div>

        <h1>
            Our Perfumes
        </h1>

        <p>
            Discover fragrances for every personality,
            mood and occasion.
        </p>

    </section>


    <!-- ================= SHOP ================= -->

    <main class="shop">

        <!-- FILTER BUTTONS -->

        <div class="filter-area">

            <button
                class="filter-btn active"
                onclick="filterProducts('All', this)">
                All
            </button>

            <button
                class="filter-btn"
                onclick="filterProducts('Men', this)">
                Men
            </button>

            <button
                class="filter-btn"
                onclick="filterProducts('Women', this)">
                Women
            </button>

            <button
                class="filter-btn"
                onclick="filterProducts('Unisex', this)">
                Unisex
            </button>

        </div>


        <!-- PRODUCT GRID -->

        <div class="product-grid" id="productGrid">

        </div>

    </main>


    <!-- ================= CART MESSAGE ================= -->

    <div class="cart-message" id="cartMessage">
        ✓ <span>Product added</span> to cart!
    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="logo">
            ESSENZA
        </div>

        <p>
            Luxury fragrances for every personality.
        </p>

        <p>
            © 2026 Essenza Perfumes. All Rights Reserved.
        </p>

    </footer>


    <script>

        /* ================= PRODUCT DATA ================= */

        const products = [

            {
                id: 1,
                name: "Dior Sauvage",
                category: "Men",
                type: "Eau de Parfum · 100ml",
                price: 6499,
                image: "https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 2,
                name: "Versace Eros",
                category: "Men",
                type: "Eau de Toilette · 100ml",
                price: 5499,
                image: "https://images.unsplash.com/photo-1615634260167-c8cdede054de?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 3,
                name: "Bleu de Chanel",
                category: "Men",
                type: "Eau de Parfum · 100ml",
                price: 7499,
                image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 4,
                name: "Acqua di Gio",
                category: "Men",
                type: "Eau de Toilette · 100ml",
                price: 5999,
                image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 5,
                name: "Gucci Bloom",
                category: "Women",
                type: "Eau de Parfum · 75ml",
                price: 6799,
                image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 6,
                name: "YSL Libre",
                category: "Women",
                type: "Eau de Parfum · 90ml",
                price: 7999,
                image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 7,
                name: "Carolina Herrera",
                category: "Women",
                type: "Eau de Parfum · 80ml",
                price: 7299,
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 8,
                name: "Chanel Coco Mademoiselle",
                category: "Women",
                type: "Eau de Parfum · 100ml",
                price: 8499,
                image: "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 9,
                name: "Tom Ford Oud Wood",
                category: "Unisex",
                type: "Eau de Parfum · 50ml",
                price: 12999,
                image: "https://images.unsplash.com/photo-1563170351-be82bc888aa4?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 10,
                name: "Jo Malone London",
                category: "Unisex",
                type: "Cologne · 100ml",
                price: 8999,
                image: "https://images.unsplash.com/photo-1590736704728-f4730bb30770?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 11,
                name: "Maison Francis Kurkdjian",
                category: "Unisex",
                type: "Eau de Parfum · 70ml",
                price: 10999,
                image: "https://images.unsplash.com/photo-1587017539504-67cfbddac569?auto=format&fit=crop&w=700&q=80"
            },

            {
                id: 12,
                name: "Armani Stronger With You",
                category: "Men",
                type: "Eau de Toilette · 100ml",
                price: 6199,
                image: "https://images.unsplash.com/photo-1590156221822-07e16f31c22d?auto=format&fit=crop&w=700&q=80"
            }

        ];


        /* ================= DISPLAY PRODUCTS ================= */

        function displayProducts(productList) {

            const grid = document.getElementById("productGrid");

            grid.innerHTML = "";

            productList.forEach(function(product) {

                grid.innerHTML += `

                    <div class="product-card">

                        <div class="image-container">

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                class="product-image"
                            >

                            <div class="category-badge">
                                ${product.category}
                            </div>

                        </div>

                        <div class="product-info">

                            <h3>
                                ${product.name}
                            </h3>

                            <p class="product-type">
                                ${product.type}
                            </p>

                            <p class="price">
                                ₹${product.price.toLocaleString("en-IN")}
                            </p>

                            <div class="buttons">

                                <a
                                    href="product.html?id=${product.id}"
                                    class="details-btn">
                                    View Details
                                </a>

                                <button
                                    class="add-btn"
                                    onclick="addToCart(${product.id})">
                                    Add to Cart
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });

        }


        /* ================= FILTER ================= */

        function filterProducts(category, button) {

            document
                .querySelectorAll(".filter-btn")
                .forEach(function(btn) {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            if (category === "All") {

                displayProducts(products);

            } else {

                const filtered = products.filter(function(product) {

                    return product.category === category;

                });

                displayProducts(filtered);

            }

        }


        /* ================= ADD TO CART ================= */

        function addToCart(productId) {

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            const product = products.find(function(item) {

                return item.id === productId;

            });

            const existingProduct = cart.find(function(item) {

                return item.id === productId;

            });


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push({

                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            updateCartCount();

            showCartMessage();

        }


        /* ================= CART COUNT ================= */

        function updateCartCount() {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            let total = 0;

            cart.forEach(function(item) {

                total += item.quantity;

            });

            document.getElementById("cartCount").innerText = total;

        }


        /* ================= MESSAGE ================= */

        function showCartMessage() {

            const message =
                document.getElementById("cartMessage");

            message.style.display = "block";

            setTimeout(function() {

                message.style.display = "none";

            }, 2000);

        }


        /* ================= INITIAL LOAD ================= */

        displayProducts(products);

        updateCartCount();

    </script>

</body>
</html>
